<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="0" fill="#F7F5EF"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="700" fill="#242424">从排队传话到关系网</text>
  <text x="600" y="108" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#5B5B5B">RNN 按顺序传递信息，Attention 让 token 直接查看上下文</text>

  <rect x="80" y="155" width="480" height="445" rx="18" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="2"/>
  <text x="320" y="205" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="700" fill="#2B2B2B">RNN：排队传话</text>
  <text x="320" y="238" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#6B6B6B">信息一步步往后传，距离越远越容易衰减</text>

  <g font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700">
    <rect x="125" y="330" width="72" height="52" rx="10" fill="#355C7D"/>
    <text x="161" y="363" text-anchor="middle" fill="#FFFFFF">我</text>
    <rect x="235" y="330" width="72" height="52" rx="10" fill="#355C7D"/>
    <text x="271" y="363" text-anchor="middle" fill="#FFFFFF">今天</text>
    <rect x="345" y="330" width="72" height="52" rx="10" fill="#355C7D"/>
    <text x="381" y="363" text-anchor="middle" fill="#FFFFFF">吃了</text>
    <rect x="455" y="330" width="72" height="52" rx="10" fill="#355C7D"/>
    <text x="491" y="363" text-anchor="middle" fill="#FFFFFF">一碗</text>
  </g>

  <g stroke="#C8553D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M202 356H228"/>
    <path d="M222 346L234 356L222 366"/>
    <path d="M312 356H338"/>
    <path d="M332 346L344 356L332 366"/>
    <path d="M422 356H448"/>
    <path d="M442 346L454 356L442 366"/>
  </g>
  <path d="M161 410C260 492 395 492 491 410" stroke="#E6A23C" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <text x="320" y="515" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#5B5B5B">远处信息要经过多次传递</text>

  <rect x="640" y="155" width="480" height="445" rx="18" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="2"/>
  <text x="880" y="205" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="700" fill="#2B2B2B">Attention：上下文关系网</text>
  <text x="880" y="238" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#6B6B6B">每个 token 可以直接关注最相关的信息</text>

  <g stroke="#8E6C88" stroke-width="3" opacity="0.72">
    <line x1="746" y1="345" x2="880" y2="275"/>
    <line x1="746" y1="345" x2="1014" y2="345"/>
    <line x1="746" y1="345" x2="880" y2="465"/>
    <line x1="880" y1="275" x2="1014" y2="345"/>
    <line x1="880" y1="275" x2="880" y2="465"/>
    <line x1="1014" y1="345" x2="880" y2="465"/>
  </g>
  <g font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700">
    <circle cx="746" cy="345" r="46" fill="#2F6F73"/>
    <text x="746" y="352" text-anchor="middle" fill="#FFFFFF">银行</text>
    <circle cx="880" cy="275" r="46" fill="#6C5B7B"/>
    <text x="880" y="282" text-anchor="middle" fill="#FFFFFF">旁边</text>
    <circle cx="1014" cy="345" r="46" fill="#C8553D"/>
    <text x="1014" y="352" text-anchor="middle" fill="#FFFFFF">河流</text>
    <circle cx="880" cy="465" r="46" fill="#4E8098"/>
    <text x="880" y="472" text-anchor="middle" fill="#FFFFFF">清澈</text>
  </g>
  <path d="M789 338C854 321 923 324 971 342" stroke="#C8553D" stroke-width="10" stroke-linecap="round" opacity="0.78"/>
  <text x="880" y="535" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#5B5B5B">“银行”重点关注“河流”，含义被上下文修正</text>
