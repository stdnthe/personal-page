<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" fill="#F7F5EF"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="700" fill="#222222">LLM 评估不是一个分数，而是一张能力地图</text>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#5F6368">不同 Benchmark 测的是不同能力，不能用单一榜单概括模型强弱</text>

  <g font-family="Arial, 'PingFang SC', sans-serif">
    <rect x="90" y="165" width="225" height="170" rx="18" fill="#EAF4F4" stroke="#2F6F73" stroke-width="2"/>
    <text x="202.5" y="215" text-anchor="middle" font-size="25" font-weight="700" fill="#1F4F52">知识</text>
    <text x="202.5" y="252" text-anchor="middle" font-size="17" fill="#2F6F73">事实问答</text>
    <text x="202.5" y="280" text-anchor="middle" font-size="17" fill="#2F6F73">专业知识</text>

    <rect x="365" y="165" width="225" height="170" rx="18" fill="#FFF4E0" stroke="#E6A23C" stroke-width="2"/>
    <text x="477.5" y="215" text-anchor="middle" font-size="25" font-weight="700" fill="#7A4D00">推理</text>
    <text x="477.5" y="252" text-anchor="middle" font-size="17" fill="#8A5A00">数学</text>
    <text x="477.5" y="280" text-anchor="middle" font-size="17" fill="#8A5A00">复杂问题分解</text>

    <rect x="640" y="165" width="225" height="170" rx="18" fill="#F6EAF2" stroke="#8E6C88" stroke-width="2"/>
    <text x="752.5" y="215" text-anchor="middle" font-size="25" font-weight="700" fill="#5E4560">代码</text>
    <text x="752.5" y="252" text-anchor="middle" font-size="17" fill="#6F4E73">算法题</text>
    <text x="752.5" y="280" text-anchor="middle" font-size="17" fill="#6F4E73">真实仓库修复</text>

    <rect x="915" y="165" width="225" height="170" rx="18" fill="#FCE9E4" stroke="#C8553D" stroke-width="2"/>
    <text x="1027.5" y="215" text-anchor="middle" font-size="25" font-weight="700" fill="#7C2D1F">Agent</text>
    <text x="1027.5" y="252" text-anchor="middle" font-size="17" fill="#8E3322">规划</text>
    <text x="1027.5" y="280" text-anchor="middle" font-size="17" fill="#8E3322">工具调用</text>

    <rect x="228" y="405" width="225" height="170" rx="18" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="2"/>
    <text x="340.5" y="455" text-anchor="middle" font-size="25" font-weight="700" fill="#222222">长上下文</text>
    <text x="340.5" y="492" text-anchor="middle" font-size="17" fill="#6B7280">检索</text>
    <text x="340.5" y="520" text-anchor="middle" font-size="17" fill="#6B7280">跨文档推理</text>

    <rect x="503" y="405" width="225" height="170" rx="18" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="2"/>
    <text x="615.5" y="455" text-anchor="middle" font-size="25" font-weight="700" fill="#222222">写作体验</text>
    <text x="615.5" y="492" text-anchor="middle" font-size="17" fill="#6B7280">表达质量</text>
    <text x="615.5" y="520" text-anchor="middle" font-size="17" fill="#6B7280">指令遵循</text>

    <rect x="778" y="405" width="225" height="170" rx="18" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="2"/>
    <text x="890.5" y="455" text-anchor="middle" font-size="25" font-weight="700" fill="#222222">可靠性</text>
    <text x="890.5" y="492" text-anchor="middle" font-size="17" fill="#6B7280">幻觉</text>
    <text x="890.5" y="520" text-anchor="middle" font-size="17" fill="#6B7280">安全与鲁棒性</text>
  </g>

  <text x="600" y="650" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#4B5563">问“哪个模型强”，必须先问“在哪类任务上强”</text>
</svg>
