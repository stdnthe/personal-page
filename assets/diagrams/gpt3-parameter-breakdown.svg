<svg width="1200" height="820" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="820" fill="#F7F5EF"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="700" fill="#222222">GPT-3 的 175B 参数大概藏在哪里？</text>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#5F6368">参数不是一个神秘总数，而是很多矩阵权重相加</text>

  <g font-family="Arial, 'PingFang SC', sans-serif">
    <rect x="75" y="150" width="1050" height="520" rx="18" fill="#FFFFFF" stroke="#D6D0C4" stroke-width="2"/>
    <text x="110" y="205" font-size="20" font-weight="700" fill="#222222">模块</text>
    <text x="455" y="205" font-size="20" font-weight="700" fill="#222222">参数来源</text>
    <text x="880" y="205" font-size="20" font-weight="700" fill="#222222">约参数量</text>
    <line x1="105" y1="225" x2="1095" y2="225" stroke="#D6D0C4" stroke-width="2"/>

    <text x="110" y="270" font-size="19" font-weight="700" fill="#1F4F52">Embedding</text>
    <text x="455" y="270" font-size="17" fill="#4B5563">d_model × vocab</text>
    <text x="880" y="270" font-size="19" font-weight="700" fill="#2F6F73">0.62B</text>

    <text x="110" y="335" font-size="19" font-weight="700" fill="#7A4D00">Q / K / V / O</text>
    <text x="455" y="335" font-size="17" fill="#4B5563">每层注意力的 4 组投影矩阵</text>
    <text x="880" y="335" font-size="19" font-weight="700" fill="#E6A23C">57.98B</text>

    <text x="110" y="400" font-size="19" font-weight="700" fill="#7C2D1F">FFN Up</text>
    <text x="455" y="400" font-size="17" fill="#4B5563">d_model → d_ff</text>
    <text x="880" y="400" font-size="19" font-weight="700" fill="#C8553D">57.98B</text>

    <text x="110" y="465" font-size="19" font-weight="700" fill="#7C2D1F">FFN Down</text>
    <text x="455" y="465" font-size="17" fill="#4B5563">d_ff → d_model</text>
    <text x="880" y="465" font-size="19" font-weight="700" fill="#C8553D">57.98B</text>

    <text x="110" y="530" font-size="19" font-weight="700" fill="#5E4560">Unembedding</text>
    <text x="455" y="530" font-size="17" fill="#4B5563">d_model × vocab</text>
    <text x="880" y="530" font-size="19" font-weight="700" fill="#8E6C88">0.62B</text>

    <line x1="105" y1="570" x2="1095" y2="570" stroke="#D6D0C4" stroke-width="2"/>
    <text x="110" y="620" font-size="22" font-weight="700" fill="#222222">合计</text>
    <text x="455" y="620" font-size="17" fill="#4B5563">以 GPT-3 规模参数估算</text>
    <text x="880" y="620" font-size="24" font-weight="700" fill="#C8553D">175.18B</text>
  </g>

  <g>
    <rect x="175" y="710" width="18" height="18" rx="4" fill="#2F6F73"/>
    <text x="205" y="725" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#4B5563">Embedding / Unembedding 相对小</text>
    <rect x="445" y="710" width="18" height="18" rx="4" fill="#E6A23C"/>
    <text x="475" y="725" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#4B5563">Attention 投影很大</text>
    <rect x="690" y="710" width="18" height="18" rx="4" fill="#C8553D"/>
    <text x="720" y="725" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#4B5563">FFN 通常是参数大头</text>
  </g>

  <text x="600" y="775" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#6B7280">示意基于 GPT-3 常见配置：d_model=12288, n_layers=96, n_heads=96, d_head=128, d_ff=49152, vocab=50257</text>
</svg>

