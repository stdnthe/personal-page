<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="680" fill="#F7F5EF"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="700" fill="#222222">LayerNorm：把每个 token 的数值拉回稳定区间</text>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#5F6368">深层网络里数值容易漂移，归一化让下一层拿到可控输入</text>

  <g font-family="Arial, 'PingFang SC', sans-serif">
    <rect x="85" y="165" width="360" height="385" rx="18" fill="#FFFFFF" stroke="#D6D0C4" stroke-width="2"/>
    <text x="265" y="210" text-anchor="middle" font-size="24" font-weight="700" fill="#222222">归一化前</text>
    <text x="265" y="240" text-anchor="middle" font-size="16" fill="#6B7280">数值尺度可能漂移</text>
    <line x1="140" y1="470" x2="390" y2="470" stroke="#CBD2D9" stroke-width="2"/>
    <line x1="140" y1="285" x2="140" y2="470" stroke="#CBD2D9" stroke-width="2"/>
    <rect x="165" y="410" width="34" height="60" fill="#CBD2D9"/>
    <rect x="215" y="365" width="34" height="105" fill="#CBD2D9"/>
    <rect x="265" y="300" width="34" height="170" fill="#C8553D"/>
    <rect x="315" y="335" width="34" height="135" fill="#CBD2D9"/>
    <text x="265" y="505" text-anchor="middle" font-size="16" fill="#6B7280">有的维度过大，有的过小</text>

    <rect x="755" y="165" width="360" height="385" rx="18" fill="#FFFFFF" stroke="#D6D0C4" stroke-width="2"/>
    <text x="935" y="210" text-anchor="middle" font-size="24" font-weight="700" fill="#222222">归一化后</text>
    <text x="935" y="240" text-anchor="middle" font-size="16" fill="#6B7280">均值归零，方差归一</text>
    <line x1="810" y1="470" x2="1060" y2="470" stroke="#CBD2D9" stroke-width="2"/>
    <line x1="810" y1="285" x2="810" y2="470" stroke="#CBD2D9" stroke-width="2"/>
    <rect x="835" y="365" width="34" height="105" fill="#2F6F73"/>
    <rect x="885" y="348" width="34" height="122" fill="#2F6F73"/>
    <rect x="935" y="330" width="34" height="140" fill="#2F6F73"/>
    <rect x="985" y="355" width="34" height="115" fill="#2F6F73"/>
    <text x="935" y="505" text-anchor="middle" font-size="16" fill="#6B7280">下一层拿到稳定输入</text>

    <rect x="505" y="285" width="190" height="130" rx="18" fill="#EAF4F4" stroke="#2F6F73" stroke-width="2"/>
    <text x="600" y="335" text-anchor="middle" font-size="26" font-weight="700" fill="#1F4F52">LayerNorm</text>
    <text x="600" y="370" text-anchor="middle" font-size="17" fill="#2F6F73">像温控器</text>
  </g>

  <g stroke="#C8553D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M450 350H497"/>
    <path d="M487 340L503 350L487 360"/>
    <path d="M700 350H747"/>
    <path d="M737 340L753 350L737 360"/>
  </g>

  <text x="600" y="610" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#4B5563">LayerNorm 不改变 token 之间谁看谁的问题，它解决的是深层网络的数值稳定性</text>
</svg>

